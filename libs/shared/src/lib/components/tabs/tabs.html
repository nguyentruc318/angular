<div role="tablist" class="inline-flex gap-1 rounded-lg bg-slate-100 p-1">
  @for (tab of tabs(); track tab.value) {
    <button
      type="button"
      role="tab"
      [disabled]="tab.disabled"
      [attr.aria-selected]="value() === tab.value"
      [class.bg-white]="value() === tab.value"
      [class.text-violet-700]="value() === tab.value"
      [class.shadow-sm]="value() === tab.value"
      [class.text-slate-600]="value() !== tab.value"
      class="rounded-md px-4 py-2 text-sm font-medium transition hover:text-violet-700 disabled:cursor-not-allowed disabled:opacity-50"
      (click)="selectTab(tab)"
    >
      {{ tab.label }}
    </button>
  }
</div>
