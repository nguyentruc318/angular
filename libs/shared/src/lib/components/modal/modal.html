@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <button
      type="button"
      class="absolute inset-0 bg-slate-900/50"
      aria-label="Close modal"
      (click)="close()"
    ></button>

    <section
      class="relative z-10 max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white shadow-2xl"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title()"
    >
      <header class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
        <h2 class="text-xl font-semibold text-slate-900">
          {{ title() }}
        </h2>

        <button
          type="button"
          class="rounded-lg p-2 text-slate-500 hover:bg-slate-100"
          aria-label="Close modal"
          (click)="close()"
        >
          <ng-icon name="lucideX" class="size-5" aria-hidden="true" />
        </button>
      </header>

      <div class="p-6">
        <ng-content />
      </div>

      <footer class="flex justify-end gap-3 border-t border-slate-200 px-6 py-4">
        <ng-content select="[modal-actions]" />
      </footer>
    </section>
  </div>
}
