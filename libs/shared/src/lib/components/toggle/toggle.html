<div class="flex items-center justify-between rounded-xl bg-slate-100 p-4">
  <div>
    <span class="block font-medium text-slate-900">
      {{ label() }}
    </span>

    @if (description()) {
      <span class="mt-1 block text-sm text-slate-500">
        {{ description() }}
      </span>
    }
  </div>

  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked()"
    [attr.aria-label]="label()"
    [disabled]="disabled()"
    (click)="toggle()"
    class="relative inline-flex h-6 w-11 shrink-0 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
    [class.bg-violet-600]="checked()"
    [class.bg-slate-300]="!checked()"
  >
    <span
      class="pointer-events-none inline-block size-5 translate-y-0.5 rounded-full bg-white shadow transition-transform"
      [class.translate-x-5]="checked()"
      [class.translate-x-0]="!checked()"
    ></span>
  </button>
</div>
