@if (isOpen()) {
  <div class="fixed inset-0 z-50">
    <button
      type="button"
      class="absolute inset-0 w-full bg-slate-900/40 opacity-100 transition-opacity duration-200 ease-out starting:opacity-0 motion-reduce:transition-none"
      aria-label="Close sheet"
      (click)="closed.emit()"
    ></button>

    <aside
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      class="absolute inset-y-0 right-0 flex h-dvh w-full max-w-200 translate-x-0 flex-col bg-white text-slate-900 shadow-2xl transition-transform duration-[220ms] ease-out starting:translate-x-full motion-reduce:transition-none"
    >
      <header
        class="flex shrink-0 items-center justify-between gap-4 border-b border-slate-200 p-6"
      >
        <h2 id="sheet-title" class="m-0 text-xl font-semibold">
          {{ title() }}
        </h2>

        <button
          type="button"
          class="grid size-10 place-items-center rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
          aria-label="Close sheet"
          (click)="closed.emit()"
        >
          <ng-icon name="lucideX" class="size-5" aria-hidden="true" />
        </button>
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto p-6">
        <ng-content />
      </div>
    </aside>
  </div>
}
