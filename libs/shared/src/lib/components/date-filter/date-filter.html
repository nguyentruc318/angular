<div class="relative inline-block">
  <button
    #filterButton
    type="button"
    class="flex items-center gap-2 rounded-lg border h-11 px-4 py-2 w-60 border-none bg-white"
    (click)="toggleMenu()"
  >
    <span>
      {{ getLabel() }}
    </span>

    <ng-icon name="lucideChevronDown" class="size-4" aria-hidden="true" />
  </button>

  @if (isMenuOpen()) {
    <div class="absolute left-0 top-full z-20 h-11 mt-2 w-60 rounded-lg bg-white p-1 shadow-lg">
      <button
        type="button"
        class="block w-full rounded px-3 py-2 text-left hover:bg-gray-100"
        (click)="selectRange(); picker.open()"
      >
        Date range
      </button>
    </div>
  }

  <mat-date-range-input
    class="pointer-events-none absolute top-2 opacity-0"
    aria-hidden="true"
    [rangePicker]="picker"
  >
    <input
      matStartDate
      tabindex="-1"
      [ngModel]="startDate()"
      (dateChange)="onStartDateChange($event.value)"
    />

    <input
      matEndDate
      tabindex="-1"
      [ngModel]="endDate()"
      (dateChange)="onEndDateChange($event.value)"
    />
  </mat-date-range-input>

  <mat-date-range-picker #picker [restoreFocus]="false" (closed)="filterButton.focus()" />
</div>
