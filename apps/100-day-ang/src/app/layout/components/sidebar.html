<aside
  class="flex h-screen flex-col border-r border-slate-200 bg-white transition-all duration-300"
  [class.w-64]="!isCollapsed()"
  [class.w-20]="isCollapsed()"
>
  <div
    class="flex h-16 items-center border-b border-slate-200"
    [class.justify-between]="!isCollapsed()"
    [class.justify-center]="isCollapsed()"
    [class.px-6]="!isCollapsed()"
  >
    @if (!isCollapsed()) {
      <span class="text-lg font-bold text-violet-600">Admin Panel</span>
    }

    <button
      type="button"
      class="rounded-lg p-2 text-slate-500 hover:bg-slate-100"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      (click)="toggleSidebar()"
    >
      <ng-icon
        [name]="isCollapsed() ? 'lucidePanelLeftOpen' : 'lucidePanelLeftClose'"
        class="size-5"
        aria-hidden="true"
      />
    </button>
  </div>

  <nav class="flex-1 space-y-6 overflow-y-auto p-4">
    @for (group of navigationGroups(); track group.label) {
      <div>
        @if (!isCollapsed()) {
          <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
            {{ group.label }}
          </p>
        }

        <div class="space-y-1">
          @for (item of group.items; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-violet-50 text-violet-700"
              class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
              [class.justify-center]="isCollapsed()"
              [attr.title]="isCollapsed() ? item.label : null"
            >
              <ng-icon [name]="item.icon" class="size-4 shrink-0" aria-hidden="true" />

              @if (!isCollapsed()) {
                <span>{{ item.label }}</span>
              }
            </a>
          }
        </div>
      </div>
    }
  </nav>

  <div class="border-t border-slate-200 p-4">
    <!-- @if (!isCollapsed()) {
      <p class="text-sm font-medium text-slate-800">Admin</p>
      <p class="mt-1 text-xs text-slate-500">admin@americantopnail.com</p>
    } -->

    @if (!isCollapsed()) {
      <button
        type="button"
        (click)="signOut()"
        [disabled]="isSigningOut()"
        class="mt-3 min-h-12 min-w-24 cursor-pointer rounded-lg bg-amber-100 px-3 py-2.5 text-sm font-medium text-red-600 transition hover:bg-amber-200 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isSigningOut()) {
          Signing out...
        } @else {
          Sign out
        }
      </button>
    } @else {
      <button
        type="button"
        (click)="signOut()"
        [disabled]="isSigningOut()"
        aria-label="Sign out"
        title="Sign out"
        class="mx-auto mt-3 flex size-10 cursor-pointer items-center justify-center rounded-lg bg-amber-100 text-red-600 transition hover:bg-amber-200 disabled:cursor-not-allowed disabled:opacity-50"
      >
        <ng-icon name="lucideLogOut" class="size-5" aria-hidden="true" />
      </button>
    }
  </div>
</aside>
