<aside class="flex h-screen w-64 flex-col border-r border-slate-200 bg-white">
  <!-- Brand -->
  <div class="flex h-16 items-center border-b border-slate-200 px-6">
    <span class="text-lg font-bold text-violet-600">Admin Panel</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-6 overflow-y-auto p-4">
    <div>
      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
        Overview
      </p>

      <a
        routerLink="/dashboard"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Dashboard
      </a>
    </div>

    <div>
      <p class="mb-2 px-3 text-xs font-semibold uppercase tracking-wider text-slate-400">
        Management
      </p>

      <a
        routerLink="/bookings"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Bookings
      </a>

      <a
        routerLink="/customers"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Customers
      </a>

      <a
        routerLink="/services"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Services
      </a>
      <a
        routerLink="/categories"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Categories
      </a>
      <a
        routerLink="/staff"
        routerLinkActive="bg-violet-50 text-violet-700"
        class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100"
      >
        Staff
      </a>
    </div>
  </nav>

  <div class="border-t border-slate-200 p-4">
    <p class="text-sm font-medium text-slate-800">Admin</p>
    <p class="mt-1 text-xs text-slate-500">admin@americantopnail.com</p>

    <button
      (click)="signOut()"
      [disabled]="isSigningOut()"
      class="mt-3 text-sm font-medium text-red-600 hover:text-red-700"
    >
      @if (isSigningOut()) {
        Signing out...
      } @else {
        Sign out
      }
    </button>
  </div>
</aside>
