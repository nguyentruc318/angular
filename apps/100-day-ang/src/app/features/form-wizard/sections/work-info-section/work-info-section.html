<fieldset [formGroup]="group()" class="space-y-5">
  <legend class="text-lg font-semibold text-slate-900">Work details</legend>

  <label class="block"><span class="mb-1.5 block text-sm font-medium text-slate-700">Department</span><input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100" formControlName="department" placeholder="Operations" /><lib-shared-form-error [show]="group().controls['department'].touched || group().controls['department'].dirty" [errors]="group().controls['department'].errors" [messages]="errors.department" /></label>
  <label class="block"><span class="mb-1.5 block text-sm font-medium text-slate-700">Role</span><input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100" formControlName="role" placeholder="Manager" /><lib-shared-form-error [show]="group().controls['role'].touched || group().controls['role'].dirty" [errors]="group().controls['role'].errors" [messages]="errors.role" /></label>
  <label class="block"><span class="mb-1.5 block text-sm font-medium text-slate-700">Job title</span><input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100" formControlName="job" placeholder="Senior coordinator" /><lib-shared-form-error [show]="group().controls['job'].touched || group().controls['job'].dirty" [errors]="group().controls['job'].errors" [messages]="errors.job" /></label>
  <label class="block"><span class="mb-1.5 block text-sm font-medium text-slate-700">Manager</span><input class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-100" formControlName="manager" placeholder="Alex Morgan" /><lib-shared-form-error [show]="group().controls['manager'].touched || group().controls['manager'].dirty" [errors]="group().controls['manager'].errors" [messages]="errors.manager" /></label>
</fieldset>
