@if (isAddingStaff()) {
  <td class="px-6 py-5">
    <input
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
      type="text"
      [formControl]="addStaffForm.controls.name"
      placeholder="Enter staff name"
    />

    @if (addStaffForm.controls.name.touched && addStaffForm.controls.name.invalid) {
      <small class="mt-1 block text-xs text-red-600">Name is required.</small>
    }
  </td>

  <td class="px-6 py-5">
    <input
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
      type="email"
      [formControl]="addStaffForm.controls.email"
      placeholder="name@example.com"
    />

    @if (addStaffForm.controls.email.touched && addStaffForm.controls.email.invalid) {
      <small class="mt-1 block text-xs text-red-600">Please enter a valid email.</small>
    }
  </td>

  <td class="px-6 py-5">
    <select
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
      [formControl]="addStaffForm.controls.status"
    >
      @for (option of statusOptions; track option.value) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </td>

  <td class="px-6 py-5">
    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-violet-700"
        (click)="saveStaff()"
      >
        Save
      </button>

      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-200"
        (click)="cancelAddStaff()"
      >
        Cancel
      </button>
    </div>
  </td>
} @else {
  <td colspan="4" class="px-6 py-4">
    <button
      type="button"
      class="inline-flex h-10 items-center rounded-lg bg-violet-600 px-4 text-sm font-semibold text-white transition hover:bg-violet-700"
      (click)="showAddRow()"
    >
      + Create staff
    </button>
  </td>
}
