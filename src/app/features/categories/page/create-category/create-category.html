<section class="p-6">
  <div class="mx-auto max-w-2xl">
    <h1 class="text-3xl font-bold text-slate-900">Create category</h1>
    <p class="my-3 text-slate-500">Add a category to organize your services.</p>

    <app-category-form
      submitLabel="Create category"
      [isSubmitting]="facade.isSaving()"
      (submitted)="facade.create($event)"
    />
  </div>
</section>
