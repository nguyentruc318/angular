<main class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
      <p class="mt-2 text-sm text-slate-500">Sign in to manage American Top Nail.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700"> Email </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
          (input)="clearFieldTouched('email')"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
        />

        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <p class="mt-1 text-sm text-red-600">Please enter a valid email.</p>
        }
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Password
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          (input)="clearFieldTouched('password')"
          autocomplete="current-password"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
        />

        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <p class="mt-1 text-sm text-red-600">Password must contain at least 6 characters.</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || isSubmitting()"
        class="w-full rounded-lg bg-violet-600 px-4 py-2.5 font-medium text-white transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (isSubmitting()) {
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>
  </section>
</main>
