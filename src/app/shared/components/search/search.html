<div>
  @if (label()) {
    <label [for]="id()" class="mb-1.5 block text-sm font-medium text-slate-700">
      {{ label() }}
    </label>
  }

  <input
    type="search"
    [id]="id()"
    [value]="value()"
    [placeholder]="placeholder()"
    class="h-11 w-full rounded-lg border border-slate-300 px-3 text-slate-900 outline-none placeholder:text-slate-400 focus:border-violet-500 focus:ring-2 focus:ring-violet-100"
    (input)="onInput($event)"
  />
</div>
