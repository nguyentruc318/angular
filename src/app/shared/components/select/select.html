<div [class]="'relative ' + containerClass()">
  @if (label()) {
    <label [for]="id()" class="mb-1.5 block text-sm font-medium text-slate-700">
      {{ label() }}
    </label>
  }

  <button
    type="button"
    [id]="id()"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="id() + '-options'"
    [disabled]="disabled()"
    class="flex h-11 w-full items-center justify-between rounded-lg border border-slate-300 bg-white px-3 text-left text-sm outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-100 disabled:cursor-not-allowed disabled:opacity-50"
    (click)="toggle()"
  >
    <span [class.text-slate-400]="!selectedOption()">
      {{ selectedOption()?.label ?? placeholder() }}
    </span>

    <svg
      class="size-4 text-slate-500 transition-transform"
      [class.rotate-180]="isOpen()"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.09 1.03l-4.25 4.5a.75.75 0 0 1-1.09 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      [id]="id() + '-options'"
      role="listbox"
      class="absolute z-50 mt-2 max-h-60 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white p-1 shadow-lg"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="option"
          class="flex w-full items-center rounded-md px-3 py-2 text-left text-sm text-slate-700 hover:bg-violet-50 hover:text-violet-700"
          [class.bg-violet-100]="option.value === value()"
          [class.text-violet-700]="option.value === value()"
          [attr.aria-selected]="option.value === value()"
          (click)="select(option)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
